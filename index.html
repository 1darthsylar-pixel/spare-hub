<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1.0 and user-scalable=no were removed on purpose. They
         switched off pinch-zoom for the whole Hub, on an app with hundreds of
         places using 11px text and dense tables, used by leaders of every age
         on a SHARED iPad that has no per-person text-size setting. Nobody could
         zoom in on a number. The only thing they bought was suppressing iOS's
         zoom-on-focus, which is fixed properly by giving inputs a 16px font. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#13293F" />
    <title>Gate City FSR · Team Tools</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <!-- ⚠️⚠️ `appleTouchIcon.png` AND `peakReachers.png` SAT AT THE REPO ROOT,
         NOT IN `public/`, AND THAT BROKE INSTALLING THE APP.

         Vite serves `public/` at `/` verbatim. A root-level image is a SOURCE
         asset instead, so it comes out hashed under `/assets/`.

         ⚠️ THE TWO LINKS BELOW WERE NEVER THE BROKEN PART, and it is worth
         writing down because I got it wrong first: Vite PROCESSES this file, so
         it rewrote `href="/appleTouchIcon.png"` to the hashed path at build and
         both links returned 200. Measured against a build of the previous
         commit, not assumed.

         WHAT ACTUALLY 404'd was everything Vite does NOT rewrite:
           · `manifest.webmanifest` — a static file in `public/`, copied
             untouched, so its `/appleTouchIcon.png` icon stayed literal and
             404'd. THIS is the install failure: a manifest listing a 180x180
             icon that cannot be fetched.
           · `/peakReachers.png` as a RUNTIME string — PeakReachersBadge's
             default `src` and storeConfig's `branding.logo`. Nothing rewrites a
             string decided at render, so the badge has been falling back to its
             built-in SVG this whole time. Silently, by design, which is why
             nobody reported it.

         Both files now live in `public/`, which is what every one of those
         references already claimed. The Village hit this and fixed it there on
         Aug 12; the fix never came back here, which is how the clone ended up
         installable and the original not.

         ⚠️ THE FAVICON IS DELIBERATELY NOT peakReachers.png ANY MORE. It is
         774x763 and 320KB. Vite used to hash it, so the tab icon was a 320KB
         download; now that the file is in `public/` it would be served literally
         and stay one. icon-192 is the same mark at tab size. -->

    <meta name="apple-mobile-web-app-title" content="Gate City Hub" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
